<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1606"/>
      <stop offset="0.5" stop-color="#120D04"/>
      <stop offset="1" stop-color="#060503"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#EAB308" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAB308" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FDE68A" stop-opacity="1"/>
      <stop offset="1" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2210"/>
      <stop offset="1" stop-color="#0C0A05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- heavy speed streaks (no brakes) -->
  <g>
    <rect x="0" y="96" width="640" height="3" rx="1.5" fill="url(#streak)" opacity="0.8"/>
    <rect x="560" y="132" width="640" height="2" rx="1" fill="url(#streak)" opacity="0.55"/>
    <rect x="0" y="356" width="520" height="2" rx="1" fill="url(#streak)" opacity="0.5"/>
    <rect x="700" y="384" width="500" height="3" rx="1.5" fill="url(#streak)" opacity="0.7"/>
    <rect x="120" y="60" width="360" height="2" rx="1" fill="url(#streak)" opacity="0.4"/>
    <rect x="820" y="70" width="380" height="2" rx="1" fill="url(#streak)" opacity="0.45"/>
  </g>

  <!-- low skyline silhouette -->
  <g fill="url(#bldg)">
    <rect x="0" y="396" width="1200" height="84"/>
    <rect x="70" y="356" width="36" height="124"/>
    <rect x="120" y="372" width="26" height="108"/>
    <rect x="170" y="338" width="40" height="142"/>
    <rect x="226" y="362" width="28" height="118"/>
    <rect x="980" y="350" width="34" height="130"/>
    <rect x="1026" y="372" width="26" height="108"/>
    <rect x="1068" y="336" width="42" height="144"/>
    <rect x="1124" y="366" width="34" height="114"/>
  </g>

  <!-- headline -->
  <text x="600" y="226" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="92" letter-spacing="2" fill="#FFFFFF">Sin Frenos</text>
  <text x="600" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="14" fill="#FDE68A">NO BRAKES · AURORA, IL</text>
</svg>
