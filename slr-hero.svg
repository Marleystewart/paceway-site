<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091420"/>
      <stop offset="0.55" stop-color="#070E18"/>
      <stop offset="1" stop-color="#05080C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#4DA8FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4DA8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#FF4757" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF4757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6C5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4DA8FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4DA8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13243A"/>
      <stop offset="1" stop-color="#080F18"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#9BD0FF"/>
      <stop offset="1" stop-color="#4DA8FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glowA)"/>
  <rect width="1200" height="480" fill="url(#glowB)"/>

  <!-- motion streaks -->
  <g opacity="0.55">
    <rect x="100" y="118" width="440" height="2" rx="1" fill="url(#streak)"/>
    <rect x="660" y="94" width="320" height="2" rx="1" fill="url(#streak)" opacity="0.7"/>
    <rect x="820" y="156" width="340" height="2" rx="1" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Chicago skyline silhouette -->
  <g fill="url(#bldg)">
    <rect x="0" y="362" width="1200" height="118"/>
    <rect x="60" y="300" width="44" height="180"/>
    <rect x="120" y="332" width="32" height="148"/>
    <rect x="170" y="262" width="40" height="218"/>
    <path d="M188 262 l2 -34 l2 34 z" fill="#1E3656"/>
    <rect x="230" y="318" width="30" height="162"/>
    <rect x="280" y="286" width="52" height="194"/>
    <rect x="350" y="240" width="46" height="240"/>
    <path d="M373 240 l0 -34 l3 0 l0 34 z" fill="#1E3656"/>
    <rect x="900" y="312" width="34" height="168"/>
    <rect x="948" y="276" width="50" height="204"/>
    <rect x="1010" y="300" width="36" height="180"/>
    <rect x="1060" y="252" width="46" height="228"/>
    <path d="M1083 252 l0 -28 l3 0 l0 28 z" fill="#1E3656"/>
    <rect x="1120" y="324" width="40" height="156"/>
  </g>
  <!-- window dots -->
  <g fill="#4DA8FF" opacity="0.55">
    <rect x="358" y="262" width="4" height="4"/><rect x="374" y="262" width="4" height="4"/>
    <rect x="358" y="284" width="4" height="4"/><rect x="380" y="296" width="4" height="4"/>
    <rect x="1068" y="272" width="4" height="4"/><rect x="1084" y="272" width="4" height="4"/>
    <rect x="1068" y="294" width="4" height="4"/><rect x="1092" y="314" width="4" height="4"/>
  </g>

  <!-- Chicago flag star -->
  <g transform="translate(218 150)">
    <path d="M0 -34 L9.6 -10.5 L34.5 -10.5 L14.4 4 L21.6 28 L0 13.5 L-21.6 28 L-14.4 4 L-34.5 -10.5 L-9.6 -10.5 Z" fill="#FF4757"/>
  </g>

  <!-- headline -->
  <text x="600" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="1" fill="url(#title)">SOUTH LOOP</text>
  <text x="600" y="284" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="1" fill="url(#title)">RUNNERS</text>
  <text x="600" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="7" fill="#9BD0FF">CHICAGO · WED · SAT · SUN</text>
</svg>
