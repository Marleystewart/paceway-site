<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150F2E"/>
      <stop offset="0.55" stop-color="#0E0A1C"/>
      <stop offset="1" stop-color="#070608"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B49BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221A3E"/>
      <stop offset="1" stop-color="#0D0A18"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- motion streaks -->
  <g opacity="0.5">
    <rect x="120" y="120" width="420" height="2" rx="1" fill="url(#streak)"/>
    <rect x="640" y="92" width="300" height="2" rx="1" fill="url(#streak)" opacity="0.7"/>
    <rect x="820" y="150" width="360" height="2" rx="1" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Houston skyline silhouette -->
  <g fill="url(#bldg)">
    <rect x="0" y="362" width="1200" height="118"/>
    <rect x="54" y="306" width="40" height="174"/>
    <rect x="110" y="338" width="30" height="142"/>
    <!-- Williams (transco) tower style spire -->
    <rect x="158" y="236" width="42" height="244"/>
    <path d="M179 236 l-1 -34 l2 0 l-1 34 z" fill="#3A2E66"/>
    <rect x="216" y="318" width="30" height="162"/>
    <rect x="262" y="288" width="48" height="192"/>
    <path d="M286 288 l-14 -22 l28 0 z" fill="#221A3E"/>
    <rect x="330" y="252" width="44" height="228"/>
    <rect x="392" y="300" width="30" height="180"/>
    <!-- right cluster (JPMorgan Chase tower style) -->
    <rect x="846" y="300" width="34" height="180"/>
    <rect x="892" y="262" width="50" height="218"/>
    <rect x="956" y="286" width="34" height="194"/>
    <rect x="1002" y="226" width="48" height="254"/>
    <path d="M1026 226 l-24 -24 l48 0 z" fill="#221A3E"/>
    <rect x="1064" y="300" width="34" height="180"/>
    <rect x="1110" y="330" width="44" height="150"/>
  </g>
  <!-- window dots -->
  <g fill="#7C5CFF" opacity="0.55">
    <rect x="338" y="270" width="4" height="4"/><rect x="354" y="270" width="4" height="4"/>
    <rect x="338" y="292" width="4" height="4"/><rect x="360" y="304" width="4" height="4"/>
    <rect x="1010" y="248" width="4" height="4"/><rect x="1028" y="248" width="4" height="4"/>
    <rect x="1010" y="270" width="4" height="4"/><rect x="1034" y="290" width="4" height="4"/>
    <rect x="168" y="270" width="4" height="4"/><rect x="186" y="300" width="4" height="4"/>
  </g>

  <!-- headline -->
  <text x="600" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="3" fill="#FFFFFF">RUN HOUSTON</text>
  <text x="600" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="12" fill="#B49BFF">ACE RUNNING CLUB · HTX</text>
</svg>
