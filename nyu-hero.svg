<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B0A2E"/>
      <stop offset="0.55" stop-color="#12061F"/>
      <stop offset="1" stop-color="#090411"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#57068C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#57068C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C026D3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1060"/>
      <stop offset="1" stop-color="#170828"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0F45"/>
      <stop offset="1" stop-color="#0D0518"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C4A5FF"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glowA)"/>
  <rect width="1200" height="480" fill="url(#glowB)"/>

  <!-- motion streaks -->
  <g opacity="0.55">
    <rect x="100" y="118" width="440" height="2" rx="1" fill="url(#streak)"/>
    <rect x="660" y="94" width="320" height="2" rx="1" fill="url(#streak)" opacity="0.7"/>
    <rect x="820" y="156" width="340" height="2" rx="1" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- skyline behind -->
  <g fill="url(#bldg)">
    <rect x="0" y="372" width="1200" height="108"/>
    <rect x="220" y="316" width="40" height="164"/>
    <rect x="272" y="340" width="30" height="140"/>
    <rect x="316" y="292" width="44" height="188"/>
    <path d="M336 292 l2 -26 l2 26 z" fill="#4A1A75"/>
    <rect x="376" y="330" width="32" height="150"/>
    <rect x="790" y="330" width="32" height="150"/>
    <rect x="836" y="296" width="44" height="184"/>
    <path d="M856 296 l2 -26 l2 26 z" fill="#4A1A75"/>
    <rect x="894" y="336" width="30" height="144"/>
    <rect x="938" y="312" width="40" height="168"/>
  </g>

  <!-- Washington Square Arch -->
  <g fill="url(#arch)" fill-rule="evenodd">
    <path d="M478 480 L478 302 Q478 290 490 290 L710 290 Q722 290 722 302 L722 480 Z
             M546 480 L546 388 A54 54 0 0 1 654 388 L654 480 Z"/>
  </g>
  <!-- arch cornice + detail -->
  <rect x="470" y="286" width="260" height="12" rx="3" fill="#4A1A75"/>
  <rect x="486" y="316" width="228" height="4" rx="2" fill="#57068C" opacity="0.6"/>

  <rect width="1200" height="480" fill="url(#glowC)"/>

  <!-- headline -->
  <text x="600" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="3" fill="url(#title)">NYU RUN CLUB</text>
  <text x="600" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="7" fill="#C4A5FF">ALL RUNNERS WELCOME</text>
</svg>
