<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0B0B"/>
      <stop offset="0.55" stop-color="#120808"/>
      <stop offset="1" stop-color="#070505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1414"/>
      <stop offset="1" stop-color="#0E0808"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- motion streaks -->
  <g opacity="0.5">
    <rect x="120" y="118" width="420" height="2" rx="1" fill="url(#streak)"/>
    <rect x="640" y="90" width="300" height="2" rx="1" fill="url(#streak)" opacity="0.7"/>
    <rect x="820" y="150" width="360" height="2" rx="1" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Chicago skyline silhouette -->
  <g fill="url(#bldg)">
    <rect x="0" y="362" width="1200" height="118"/>
    <rect x="48" y="312" width="38" height="168"/>
    <rect x="98" y="338" width="28" height="142"/>
    <!-- Willis / Sears tower with twin antennas -->
    <rect x="138" y="238" width="60" height="242"/>
    <rect x="150" y="222" width="4" height="16" fill="#3A1A1A"/>
    <rect x="182" y="222" width="4" height="16" fill="#3A1A1A"/>
    <rect x="210" y="300" width="30" height="180"/>
    <rect x="252" y="276" width="46" height="204"/>
    <rect x="312" y="330" width="28" height="150"/>
    <!-- right: Hancock-style tapered tower -->
    <path d="M880 480 l10 -210 l34 0 l10 210 z" fill="url(#bldg)"/>
    <rect x="900" y="252" width="4" height="18" fill="#3A1A1A"/>
    <rect x="914" y="252" width="4" height="18" fill="#3A1A1A"/>
    <rect x="952" y="300" width="34" height="180"/>
    <rect x="1000" y="264" width="48" height="216"/>
    <rect x="1062" y="312" width="32" height="168"/>
    <rect x="1108" y="334" width="44" height="146"/>
  </g>
  <!-- window dots -->
  <g fill="#DC2626" opacity="0.5">
    <rect x="150" y="262" width="4" height="4"/><rect x="168" y="262" width="4" height="4"/><rect x="182" y="262" width="4" height="4"/>
    <rect x="150" y="284" width="4" height="4"/><rect x="182" y="300" width="4" height="4"/>
    <rect x="1008" y="286" width="4" height="4"/><rect x="1026" y="286" width="4" height="4"/>
    <rect x="1008" y="308" width="4" height="4"/><rect x="1032" y="330" width="4" height="4"/>
  </g>

  <!-- headline + cross -->
  <text x="600" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="80" letter-spacing="2" fill="#FFFFFF">RUN WITH CHRIST</text>
  <g transform="translate(600 268)">
    <rect x="-1.5" y="-14" width="3" height="34" rx="1" fill="#DC2626"/>
    <rect x="-9" y="-5" width="18" height="3" rx="1" fill="#DC2626"/>
  </g>
  <text x="600" y="312" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="10" fill="#F87171">RWC · CHICAGO · NOT JUST A RUN CLUB</text>
</svg>
