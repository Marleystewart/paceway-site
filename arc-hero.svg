<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0A0E18"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141C2E"/>
      <stop offset="1" stop-color="#0A0E16"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="480" fill="url(#sky)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- motion streaks -->
  <g opacity="0.5">
    <rect x="120" y="120" width="420" height="2" rx="1" fill="url(#streak)"/>
    <rect x="640" y="92" width="300" height="2" rx="1" fill="url(#streak)" opacity="0.7"/>
    <rect x="820" y="150" width="360" height="2" rx="1" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Atlanta skyline silhouette -->
  <g fill="url(#bldg)">
    <rect x="0" y="360" width="1200" height="120"/>
    <rect x="60" y="300" width="46" height="180"/>
    <rect x="120" y="330" width="34" height="150"/>
    <rect x="170" y="270" width="40" height="210"/>
    <path d="M188 270 l2 -22 l2 22 z" fill="#1B2740"/>
    <rect x="230" y="320" width="30" height="160"/>
    <rect x="280" y="290" width="52" height="190"/>
    <rect x="350" y="248" width="44" height="232"/>
    <path d="M372 248 l0 -30 l4 0 l0 30 z" fill="#1B2740"/>
    <rect x="900" y="312" width="34" height="168"/>
    <rect x="946" y="280" width="48" height="200"/>
    <rect x="1006" y="300" width="36" height="180"/>
    <rect x="1054" y="258" width="46" height="222"/>
    <path d="M1077 258 l0 -26 l3 0 l0 26 z" fill="#1B2740"/>
    <rect x="1112" y="326" width="40" height="154"/>
  </g>
  <!-- window dots -->
  <g fill="#3B82F6" opacity="0.5">
    <rect x="358" y="270" width="4" height="4"/><rect x="372" y="270" width="4" height="4"/>
    <rect x="358" y="290" width="4" height="4"/><rect x="380" y="300" width="4" height="4"/>
    <rect x="1062" y="280" width="4" height="4"/><rect x="1078" y="280" width="4" height="4"/>
    <rect x="1062" y="300" width="4" height="4"/><rect x="1086" y="320" width="4" height="4"/>
    <rect x="180" y="290" width="4" height="4"/><rect x="196" y="310" width="4" height="4"/>
  </g>

  <!-- headline -->
  <text x="600" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="86" letter-spacing="2" fill="#FFFFFF">RUN THIS CITY</text>
  <text x="600" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="10" fill="#60A5FA">ATLANTA RUN CLUB · EST. 2018</text>
</svg>
